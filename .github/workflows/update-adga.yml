name: Update ADGA shows and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-duplicate-fix:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Test show import without publishing
        run: python script/update_adga.py
      - name: Verify Arizona duplicate removed and original ID retained
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = Path("data/shows.js").read_text(encoding="utf-8")
          shows = json.loads(re.search(r"window\.ADGA_SHOWS\s*=\s*(\[.*?\])\s*;", data, re.S).group(1))
          def name(s):
              return re.sub(r"[^a-z0-9]", "", s.lower().replace("’", "'"))
          matching = [x for x in shows if x.get("start") == "2026-11-01"
                      and x.get("location", "").lower() == "phoenix"
                      and name(x.get("show_name", "")) == "arizonastategoatbreedersassociation"]
          print("Arizona Phoenix November 1 records:", len(matching))
          print("Matching IDs:", [x.get("id") for x in matching])
          print("Total archived shows:", len(shows))
          assert len(matching) == 1, "Arizona show still duplicated"
          assert matching[0]["id"] == 334, "Original saved-show ID was not retained"
          print("PASS: duplicate removed; original ID 334 preserved.")
          PY

  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Refresh ADGA show archive
        run: python script/update_adga.py
      - name: Commit refreshed data if changed
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- data/shows.js data/geocode_cache.json; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/shows.js data/geocode_cache.json
            git commit -m "Update ADGA sanctioned show data"
            git push
          fi
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

